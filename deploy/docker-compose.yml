# Sabrehaven with the browser client. From this directory:
#   cp .env.example .env    # then edit it
#   docker compose up -d --build
#   ./create-account.sh 123456 secret "Character Name"
name: sabrehaven

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sabrehaven
      MARIADB_USER: sabrehaven
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
      # Run once, in this order, when the database volume is first created
      - ../sabrehaven.sql:/docker-entrypoint-initdb.d/01-sabrehaven.sql:ro
      - ./db/02-znote-schema.sql:/docker-entrypoint-initdb.d/02-znote-schema.sql:ro
      - ../sabrehaven_znote.sql:/docker-entrypoint-initdb.d/03-sabrehaven-znote.sql:ro
      - ./db/04-powergamers.sql:/docker-entrypoint-initdb.d/04-powergamers.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ..
    restart: unless-stopped
    # Time to save and kick the players on docker stop before being killed
    stop_grace_period: 2m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: sabrehaven
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: sabrehaven
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      SERVER_NAME: ${SERVER_NAME:-}
      MOTD: ${MOTD:-}
      MAX_PACKETS_PER_SECOND: ${MAX_PACKETS_PER_SECOND:-25}
    # Not published: only the proxy reaches the game ports (see trustForwardedFor)
    expose:
      - "7171"
      - "7172"

  # Database dumps in deploy/backups (see backup.sh)
  backup:
    image: mariadb:11.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/backup.sh"]
    environment:
      DB_HOST: db
      DB_USER: sabrehaven
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: sabrehaven
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        CLIENT_URL: ${CLIENT_URL:-https://github.com/jakoblindell/ot-client/releases/download/web-client-792-latest/otclient-web.zip}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS: ${TLS:-internal}
      LOGIN_PORT: ${LOGIN_PORT:-7171}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-static 127.0.0.1/32}
      GAME_CONNECTIONS_PER_MINUTE: ${GAME_CONNECTIONS_PER_MINUTE:-30}
      LOGINS_PER_MINUTE: ${LOGINS_PER_MINUTE:-30}
    ports:
      - "80:80"
      - "443:443"
      - "${LOGIN_PORT:-7171}:${LOGIN_PORT:-7171}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
